  const symLine = (sy) => `${sy.k}${sy.x ? '' : ' (intern)'} ${sy.s && sy.k === 'fn' ? sy.s : sy.n}${sy.k !== 'fn' && sy.s ? ' ' + sy.s : ''} :${sy.l}`;
  const tools = [
    { name: 'get_unit', description: 'Gibt Details zu einem Baustein der Karte: Rolle, Beschreibung, wichtigste Dateien mit Funktionen, wen er nutzt, wer ihn nutzt, externe Bibliotheken, Hinweise. Parameter: unit = Name oder id des Bausteins (z. B. "Communication").', inputSchema: { type: 'object', properties: { unit: { type: 'string' } }, required: ['unit'] },
      execute: ({ unit }) => {
        const m = find(unit); if (!m.length) throw new Error('Kein Baustein gefunden: ' + unit);
        const kk = String(unit).toLowerCase(), exact = m.filter((x) => x.id === unit || x.label.toLowerCase() === kk), pool = exact.length ? exact : m;
        if (pool.length > 1) return { mehrdeutig: pool.slice(0, 8).map((x) => ({ id: x.id, name: x.label, rolle: rl(x) })), hinweis: 'Bitte mit der id erneut aufrufen.' };
        const u = pool[0];
        return { id: u.id, name: u.label, rolle: rl(u), beschreibung: u.doc, dateien: u.fileCount, zeilen: u.loc,
          wichtigste_dateien: u.files.slice(0, 30).map((f) => ({ pfad: f.path, zeilen: f.loc, beschreibung: f.doc, symbole: (f.sym || []).filter((s2) => s2.x).slice(0, 6).map(symLine) })),
          nutzt: u.uses.map((x) => ({ baustein: nm(x.id), verweise: x.count })), genutzt_von: u.usedBy.map((x) => ({ baustein: nm(x.id), verweise: x.count })),
          externe_bibliotheken: u.ext.map((e) => e[0]), hinweise: D.issues.filter((i) => i.from === u.id || i.to === u.id).map((i) => `${nm(i.from)} -> ${nm(i.to)}: ${i.why} (${i.count}x, z. B. ${i.samples.map((s2) => s2.from + ':' + s2.line).join(', ')})`) };
      } },
    { name: 'get_file', description: 'Gibt Details zu einer Datei: Baustein, Zeilen, Funktionen/Typen/Schemas mit Signatur und Mitgliedern, welche anderen Bausteine sie nutzt und wer sie nutzt. Parameter: path = Dateipfad oder ein eindeutiger Teil davon.', inputSchema: { type: 'object', properties: { path: { type: 'string' } }, required: ['path'] },
      execute: ({ path }) => {
        const k = String(path || '').toLowerCase(); const hits = [];
        for (const u of D.units) for (const f of u.files) if (f.path.toLowerCase() === k || f.path.toLowerCase().endsWith('/' + k) || f.path.toLowerCase().includes(k)) hits.push([u, f]);
        if (!hits.length) throw new Error('Keine Datei gefunden: ' + path);
        if (hits.length > 1 && !hits.some(([, f]) => f.path.toLowerCase() === k)) return { mehrdeutig: hits.slice(0, 10).map(([u, f]) => f.path) };
        const [u, f] = hits.find(([, x]) => x.path.toLowerCase() === k) || hits[0];
        return { pfad: f.path, baustein: nm(u.id), zeilen: f.loc, beschreibung: f.doc, bibliotheken: f.ext, nutzt: f.out.map(([id, c]) => `${nm(id)} (${c}x)`), genutzt_von: f.in.map(([id, c]) => `${nm(id)} (${c}x)`),
          symbole: (f.sym || []).slice(0, 30).map((sy) => ({ art: sy.k, name: sy.n, zeile: sy.l, signatur: sy.s, exportiert: !!sy.x, mitglieder: (sy.m || []).slice(0, 12).map((q) => q[1] || q[0]) })) };
      } },
    { name: 'find', description: 'Sucht einen Begriff in Bausteinnamen, Dateipfaden und Funktions-, Typ- und Schemanamen. Gibt bis zu 20 Treffer mit Fundort. Parameter: query.', inputSchema: { type: 'object', properties: { query: { type: 'string' } }, required: ['query'] },
      execute: ({ query }) => {
        const k = String(query || '').toLowerCase(); const out = [];
        for (const u of D.units) {
          if (u.label.toLowerCase().includes(k)) out.push({ art: 'Baustein', name: nm(u.id) });
          for (const f of u.files) {
            if (f.path.toLowerCase().includes(k)) out.push({ art: 'Datei', pfad: f.path, baustein: nm(u.id) });
            for (const sy of f.sym || []) if (sy.n.toLowerCase().includes(k)) out.push({ art: sy.k, name: sy.n, pfad: f.path + ':' + sy.l, baustein: nm(u.id) });
            if (out.length >= 20) return out;
          }
        }
        return out;
      } },
    { name: 'get_issues', description: 'Gibt alle erkannten Regelverstöße (rot) und Hinweise (orange) mit Dateistellen zurück.', inputSchema: { type: 'object', properties: {} },
      execute: () => D.issues.slice(0, 40).map((i) => ({ art: i.cls === 'violation' ? 'Regelverstoß' : 'Hinweis', von: nm(i.from), nach: nm(i.to), grund: i.why, verweise: i.count, stellen: i.samples.map((s2) => s2.from + ':' + s2.line) })) },
  ];
  const overview = () => {
    const rank = (u) => u.uses.length + u.usedBy.length;
    const list = D.units.slice().sort((a, b) => rank(b) - rank(a)).slice(0, 80).map((u) => `- ${u.label} [${rl(u)}], ${u.fileCount} Dateien, nutzt: ${u.uses.slice(0, 6).map((x) => U.get(x.id).label).join(', ') || '–'}; genutzt von: ${u.usedBy.slice(0, 6).map((x) => U.get(x.id).label).join(', ') || '–'}`);
    const bad = D.issues.filter((i) => i.cls === 'violation').length, warn = D.issues.filter((i) => i.cls === 'warn').length;
    return `Projekt „${D.project.name}“: ${D.stats.files} Dateien, ${D.stats.loc} Zeilen, ${D.stats.units} Bausteine, ${bad} Regelverstöße, ${warn} Hinweise.\nBausteine:\n${list.join('\n')}`;
  };
  const RULES = `Du erklärst einem Laien den Aufbau eines Softwareprojekts anhand einer automatisch erzeugten Architekturkarte. Du siehst nur Strukturdaten (Bausteine, Rollen, Verweise, Dateinamen, Funktionssignaturen, Kommentare am Dateianfang), keinen Quelltext. Schlage Details mit den Werkzeugen nach, statt zu raten. Wenn etwas aus den Daten nicht hervorgeht, sage das ausdrücklich. Nenne Bausteine und Dateien mit ihren Namen. Antworte kurz und in einfachem Deutsch; erkläre Fachbegriffe beim ersten Gebrauch. Begriffe: Fachmodul = Fachlogik eines Themas; Port = Vertrag an der Grenze der Fachlogik; Adapter = technische Anbindung nach außen; Eingang = hier kommt etwas von außen an; Querschnitt = wird überall gebraucht (z. B. Fehlerbehandlung). Rot = Regelverstoß (Fachlogik greift nach außen), orange = Hinweis.\n\n`;
  const history = [];
  let ctl = null, busy = false;
  const ctxText = () => { const s0 = api.ST; const u = s0.sel && U.get(s0.sel); return u ? `Bezug: ${u.label}${s0.file ? ' · ' + s0.file.split('/').pop() : ''}` : 'Bezug: ganzes Projekt (Klick auf einen Baustein setzt den Bezug)'; };
  const refreshCtx = () => {
    $c('cctx').textContent = ctxText();
    const u = api.ST.sel && U.get(api.ST.sel);
    const sugg = [u ? `Was macht ${u.label}?` : 'Erkläre die Architektur in fünf Sätzen', u ? `Wo könnte bei ${u.label} etwas fehlen?` : 'Welche Hinweise sollte ich zuerst prüfen?', 'Wo ist die Fehlerbehandlung noch nicht angebunden?', 'Welche Module hängen am stärksten zusammen?'];
    $c('csugg').innerHTML = sugg.map((t) => `<button type="button">${esc2(t)}</button>`).join('');
    $c('csugg').querySelectorAll('button').forEach((b) => (b.onclick = () => { $c('cq').value = b.textContent; ask(); }));
  };
  const errText = (e) => ({ not_granted: 'Du hast die Nutzung von Claude für diese Seite nicht erlaubt. Der Chat ist hier aus.', sampling_disabled: 'Claude ist für dieses Konto nicht verfügbar.', rate_limited: e.reason === 'usage_limit' ? 'Dein Claude-Kontingent ist gerade aufgebraucht. Bitte später erneut fragen.' : 'Zu viele Anfragen kurz hintereinander. Bitte einen Moment warten.', session_expired: 'Bitte neu bei Claude anmelden und die Seite neu laden.', prompt_too_large: 'Die Frage samt Kontext ist zu groß.', refused: 'Claude hat diese Frage nicht beantwortet.', empty_completion: 'Claude hat keine Antwort geliefert. Bitte anders fragen.', upstream_error: 'Verbindungsproblem. Bitte erneut versuchen.' }[e && e.code] || 'Das hat nicht geklappt (' + (e && e.code || 'unbekannt') + ').');
  async function ask() {
    const q = $c('cq').value.trim(); if (!q || busy) return;
    const sample = await getSample(); if (!sample) return;
    busy = true; $c('cgo').disabled = true; $c('cstop').hidden = false; $c('cstate').textContent = 'Claude denkt nach …';
    const item = document.createElement('div'); item.className = 'qa';
    item.innerHTML = `<p class="q">${esc2(q)}</p><div class="a"><p class="ftag">Claude denkt nach …</p></div><div class="meta"></div>`;
    $c('canswers').prepend(item);
    const aEl = item.querySelector('.a'), meta = item.querySelector('.meta');
    $c('cq').value = '';
    const u = api.ST.sel && U.get(api.ST.sel);
    const lim = await sample.limits().catch(() => ({}));
    const useTools = !!(lim && lim.tools);
    let ctxInfo = u ? `\nAktuell ausgewählt: Baustein „${u.label}“ [${rl(u)}]${api.ST.file ? ', Datei ' + api.ST.file : ''}.` : '';
    if (!useTools && u) ctxInfo += '\n' + JSON.stringify(tools[0].execute({ unit: u.label })).slice(0, 12000);
    const turns = [{ role: 'user', content: RULES + overview() }];
    for (const h of history.slice(-3)) { turns.push({ role: 'user', content: h.q }, { role: 'assistant', content: h.a }); }
    turns.push({ role: 'user', content: q + ctxInfo });
    ctl = new AbortController();
    let used = 0;
    const counted = useTools ? tools.map((t) => ({ ...t, execute: (inp, c) => { used++; meta.textContent = `schlägt nach … (${used})`; return t.execute(inp, c); } })) : undefined;
    try {
      const res = await sample(turns, { cache: false, signal: ctl.signal, modelTier: 'default', ...(counted ? { tools: counted } : {}), onText: ({ text }) => { aEl.innerHTML = md(text); } });
      aEl.innerHTML = md(res.text); history.push({ q, a: res.text });
      meta.textContent = `${useTools ? used + ' Nachschläge in den Karten-Daten' : 'ohne Nachschlagen'}${res.truncated ? ' · gekürzt, bitte kleiner fragen' : ''}`;
    } catch (e) {
      if (e && e.code === 'cancelled') { if (e.text) aEl.innerHTML = md(e.text); else item.remove(); meta.textContent = e.text ? 'gestoppt' : ''; }
      else { item.classList.add('err'); aEl.innerHTML = (e && e.text ? md(e.text) : '') + `<p>${esc2(errText(e || {}))}</p>`; }
    } finally { busy = false; ctl = null; $c('cgo').disabled = false; $c('cstop').hidden = true; $c('cstate').textContent = ''; }
  }
  let samplePromise = null;
  function getSample() {
    if (!samplePromise) samplePromise = (async () => {
      try { const c = window.claude; const sm = c && c.use ? await c.use('sample') : null; return sm || null; } catch { return null; }
    })().then((sm) => { if (!sm) { $c('cnote').textContent = 'Der Chat ist nur in der veröffentlichten Artefakt-Version verfügbar. Dort fragt die Seite Claude über dein eigenes Claude-Konto, ein API-Schlüssel ist nicht nötig.'; $c('cq').disabled = true; $c('cgo').disabled = true; } return sm; });
    return samplePromise;
  }
  $c('cgo').onclick = ask;
  $c('cstop').onclick = () => ctl && ctl.abort();
  $c('cq').onkeydown = (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); ask(); } };
  refreshCtx(); getSample();
  $c('cnote').textContent = $c('cnote').textContent || 'Jede Frage nutzt dein eigenes Claude-Kontingent. Claude sieht nur die Strukturdaten dieser Karte, keinen Quelltext.';
  api.onSelection = refreshCtx;
}

initChat();
window.codemap = { select: (id) => api.select(id), open: (id, f) => api.open(id, f), fit: () => api.fit() };

})();
</script>
